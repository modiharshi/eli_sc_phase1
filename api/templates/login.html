{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<h1>Log in</h1>{% if error %}<div class="banner">{{error}}</div>{% endif %}
<form method="post" action="/login" class="card" style="max-width:360px"><input type="hidden" name="next" value="{{next}}">
<p><label>Username<br><input name="username" autocomplete="username" required autofocus style="width:100%"></label></p>
<p><label>Password<br><input name="password" type="password" autocomplete="current-password" required style="width:100%"></label></p>
<button class="primary">Log in</button></form>
<p class="note">Local access only (127.0.0.1). Accounts are created by an administrator: <code>python -m api.manage create-user NAME ROLE</code>.</p>
{% endblock %}
